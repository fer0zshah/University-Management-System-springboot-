<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="University Management System">
    <title>University Management System</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
<main id="login-view" class="login-view">
    <form id="login-form" class="login-card" novalidate>
        <div class="brand-mark" aria-hidden="true">U</div>
        <h1>University Management System</h1>
        <p class="muted">Sign in to manage university records</p>
        <label for="login-username">Username</label>
        <input id="login-username" name="username" autocomplete="username" required autofocus>
        <label for="login-password">Password</label>
        <input id="login-password" name="password" type="password" autocomplete="current-password" required>
        <p id="login-error" class="form-error" role="alert"></p>
        <button id="login-button" class="button primary full" type="submit">Sign in</button>
    </form>
</main>

<div id="app-view" class="app-view hidden">
    <header class="topbar">
        <a class="app-name" href="/">University Management System</a>
        <div class="account">
            <span id="user-full-name"></span>
            <span id="role-badge" class="role-badge"></span>
            <button id="logout-button" class="button ghost" type="button">Logout</button>
        </div>
    </header>

    <main class="page-shell">
        <nav id="resource-tabs" class="tabs" aria-label="Resources"></nav>
        <section class="data-card" aria-live="polite">
            <div class="toolbar">
                <div>
                    <p class="eyebrow">Directory</p>
                    <h2 id="section-title"></h2>
                </div>
                <div class="toolbar-actions">
                    <label class="search">
                        <span class="sr-only">Search records</span>
                        <input id="search-input" type="search" placeholder="Search records...">
                    </label>
                    <button id="add-button" class="button primary" type="button">+ Add new</button>
                </div>
            </div>
            <div id="table-container" class="table-container"></div>
        </section>
    </main>
</div>

<div id="modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-panel">
        <div class="modal-header">
            <h2 id="modal-title"></h2>
            <button id="modal-close" class="icon-button" type="button" aria-label="Close">&times;</button>
        </div>
        <form id="record-form" novalidate>
            <div id="form-fields" class="form-grid"></div>
            <p id="modal-error" class="form-error" role="alert"></p>
            <div class="modal-actions">
                <button id="modal-cancel" class="button secondary" type="button">Cancel</button>
                <button id="save-button" class="button primary" type="submit">Save</button>
            </div>
        </form>
    </div>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="/app.js" defer></script>
</body>
</html>
